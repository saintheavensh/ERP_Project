# FlowServ — reverse proxy.
#
# Dua tujuan di satu domain:
#   /       → web  (SvelteKit SSR, port 3000)
#   /api/   → api  (Hono, port 3001) — awalan /api dilepas saat diteruskan
#
# Kenapa satu domain dan bukan dua: menaruh API di subdomain lain menambah
# CORS, sertifikat kedua, dan satu DNS lagi yang bisa salah — tanpa memberi
# apa pun yang dibutuhkan toko satu cabang.

server {
    listen 80;
    server_name _;

    # Jalur verifikasi Let's Encrypt. HARUS tetap di HTTP dan tidak boleh ikut
    # dialihkan ke HTTPS — di penerbitan pertama, sertifikatnya belum ada.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Setelah sertifikat terbit, hapus tanda komentar blok di bawah dan blok
    # `server { listen 443 ... }` di bawahnya. Dibiarkan mati supaya
    # `docker compose up` yang PERTAMA tidak gagal karena berkas sertifikat
    # yang memang belum ada — kegagalan yang membingungkan di menit pertama
    # deploy, dan yang membuat orang menyerah sebelum sempat menerbitkannya.
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (PLT-013) belum dibangun, tapi dua baris ini yang akan
        # dibutuhkannya, dan tanpa keduanya kegagalannya tampak seperti bug
        # aplikasi. Aman dipasang sekarang.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

